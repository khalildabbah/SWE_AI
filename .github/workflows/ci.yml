name: CI

on:
  push:
    branches: [main, khalil]
  pull_request:
    branches: [main, khalil]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deterioration-detector
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: deterioration-detector/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate sample data
        run: python scripts/generate_sample_data.py

      - name: Build database (M1+M2)
        run: python scripts/build_db.py

      - name: Build risk table (M3-M6)
        run: python scripts/build_risk.py

      - name: Run tests
        run: pytest -q

      - name: Verify sample risk distribution
        run: |
          python - <<'PY'
          import sys
          import duckdb

          con = duckdb.connect("data/processed/labs.duckdb", read_only=True)
          dist = dict(
              con.execute(
                  "SELECT category, COUNT(*) FROM risk_summary GROUP BY category"
              ).fetchall()
          )
          # the 9 curated showcase admissions (subject ids 10001-10009) must always
          # land 3 High / 3 Medium / 3 Low, independent of the procedural cohort.
          curated = dict(
              con.execute(
                  "SELECT category, COUNT(*) FROM risk_summary "
                  "WHERE subject_id BETWEEN 10001 AND 10009 GROUP BY category"
              ).fetchall()
          )
          con.close()

          total = sum(dist.values())
          print(f"Risk distribution: {dist}  (total {total})")
          print(f"Curated 9:         {curated}")

          errors = []
          for cat in ("High", "Medium", "Low"):
              if dist.get(cat, 0) < 1:
                  errors.append(f"category {cat!r} is empty")
          if total < 1000:
              errors.append(f"expected a large procedural cohort, got only {total} admissions")
          if curated != {"High": 3, "Medium": 3, "Low": 3}:
              errors.append(f"curated showcase cohort mismatch: {curated}")

          if errors:
              sys.exit("Sample distribution check failed: " + "; ".join(errors))
          print("OK: all three risk tiers populated and curated 9 = 3 High / 3 Medium / 3 Low.")
          PY
